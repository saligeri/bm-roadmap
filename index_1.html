<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Роадмап Бонус-машины</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1e1b2e;--mut:#6b6577;--acc:#6d28d9;--err:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#16141f;--card:#211e2e;--ink:#f1eef7;--mut:#a39db0;--acc:#a78bfa;--err:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.form{background:var(--card);width:100%;max-width:380px;padding:32px 28px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:22px}p{margin:0;color:var(--mut);font-size:14px;line-height:1.45}
input{font:inherit;font-size:16px;padding:12px 14px;border-radius:10px;border:1.5px solid #d6d1dd;background:transparent;color:var(--ink)}input:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}button:disabled{opacity:.6}
.pw{position:relative}.pw input{width:100%;padding-right:48px}#eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;color:var(--mut);padding:6px 8px;font-size:18px;width:auto}#eye.on{color:var(--acc)}.hint{font-size:13px;color:var(--mut);min-height:0}.err{color:var(--err);font-size:14px;min-height:20px}
</style></head><body>

const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const er=document.getElementById('e'),bt=document.getElementById('b'),inp=document.getElementById('p');
const EN="qwertyuiop[]asdfghjkl;'zxcvbnm,.",RU="йцукенгшщзхъфывапролджэячсмитьбю";
function fixLayout(v){if(/[а-яё]/i.test(v))return v;return v.toLowerCase().split('').map(ch=>{const i=EN.indexOf(ch);return i<0?ch:RU[i]}).join('');}
function norm(v){return fixLayout(v.normalize('NFC').trim().toLowerCase()).split('ё').join('е');}
document.getElementById('eye').addEventListener('click',()=>{const on=inp.type==='password';inp.type=on?'text':'password';document.getElementById('eye').classList.toggle('on',on);inp.focus();});
inp.addEventListener('input',()=>{const v=inp.value;document.getElementById('h').textContent=(v&&!/[а-яё]/i.test(v)&&/[a-z]/i.test(v))?'Похоже, включена английская раскладка — это не страшно, пароль всё равно сработает.':'';});
async function decrypt(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt);}
function show(html){
  try{document.open();document.write(html);document.close();return;}catch(e){}
  const f=document.createElement('iframe');f.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');f.srcdoc=html;document.body.innerHTML='';document.body.appendChild(f);
}
if(!(window.crypto&&crypto.subtle)){er.textContent='Этот просмотрщик не умеет открывать защищённые страницы. Откройте ссылку в браузере (Safari, Chrome), а не в превью файла.';bt.disabled=true;}
async function run(){er.textContent='';bt.disabled=true;bt.textContent='Открываю…';
  let html;
  try{html=await decrypt(norm(inp.value));}catch(x){er.textContent='Неверный пароль';bt.disabled=false;bt.textContent='Открыть';inp.select();return;}
  try{sessionStorage.setItem('rm_pw',norm(inp.value))}catch(x){}
  show(html);
}
bt.addEventListener('click',run);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run();}});
try{const s=sessionStorage.getItem('rm_pw');if(s&&window.crypto&&crypto.subtle)decrypt(s).then(show).catch(()=>{})}catch(e){}
